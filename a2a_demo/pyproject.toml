[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a_demo"
version = "0.1.0"
authors = [
    {name = "AI Agent Developer"}
]
description = "A2A Protocol Demo with Multiple Agents"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.1.0",
    "numpy<1.26.0,>=1.22.0",
    "langchain-google-genai>=0.0.5",
    "langgraph>=0.0.20",
    "crewai>=0.11.2",
    "httpx>=0.24.1",
    "httpx-sse>=0.3.1",
    "fastapi>=0.103.1",
    "uvicorn>=0.23.2",
    "starlette>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "sse-starlette>=1.6.5"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
] 
[tool.setuptools]
packages = ["agents", "common", "chat_ui"]